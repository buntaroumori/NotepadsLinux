name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend tests (node)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Smoke test (jsdom)
        run: npm test
      - name: Build the single-file demo
        run: npm run demo
      - name: Upload the demo as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepads-linux-demo-html
          path: demo/notepads-for-linux-demo.html

  # --------------------------------------------------------------------------
  rust:
    name: Rust backend tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Generate icons
        run: |
          python3 -m pip install --user pillow
          python3 scripts/make-icons.py
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: cargo test (encoding + line ending codecs)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # --------------------------------------------------------------------------
  bundle:
    name: Bundles (${{ matrix.bundle }})
    needs: [frontend, rust]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: deb
            args: --bundles deb
          - bundle: rpm
            args: --bundles rpm
          - bundle: appimage
            args: --bundles appimage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Generate icons
        run: |
          python3 -m pip install --user pillow
          python3 scripts/make-icons.py
      - run: npm ci --no-audit --no-fund
      - name: Build ${{ matrix.bundle }}
        run: npx tauri build ${{ matrix.args }}
      - name: Collect artifacts
        run: |
          mkdir -p dist
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: notepads-linux-${{ matrix.bundle }}
          path: dist/*
