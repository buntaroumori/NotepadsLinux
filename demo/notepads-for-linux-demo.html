/* =============================================================================
   Notepads for Linux — Fluent Design stylesheet
   Colour values were sampled from the original application's public
   screenshots; see docs/REVERSE_ENGINEERING.md §2 for the measurement table.
   ============================================================================= */

@font-face {
  font-family: 'NotepadsUI';
  src: local('Segoe UI Variable Text'), local('Segoe UI Variable'), local('Segoe UI'),
       local('Inter'), local('Cantarell'), local('Noto Sans'), local('DejaVu Sans'), local('Ubuntu');
  font-display: swap;
}

:root {
  /* --- geometry (measured) --- */
  --titlebar-h: 32px;
  --tab-h: 26px;
  --statusbar-h: 27px;
  --settings-rail-w: 48px;
  --gutter-pad: 12px;
  --editor-pad-x: 18px;
  --editor-pad-y: 6px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --font-ui: 'NotepadsUI', 'Segoe UI Variable Text', 'Segoe UI', Inter, Cantarell, 'Noto Sans', system-ui, sans-serif;
  --font-mono: 'Cascadia Mono', 'Cascadia Code', Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace;
  --font-size-ui: 12px;
  --font-size-status: 11px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

/* ---------------------------------- themes ---------------------------------- */
:root,
:root[data-theme='dark'] {
  --bg-window: #1f2225;
  --bg-editor: #1f2225;
  --bg-strip: linear-gradient(180deg, #323a3e 0%, #2b3236 88%, #262b2e 100%);
  --bg-tab-active: #2f3231;
  --bg-tab-inactive: #3c4446;
  --bg-tab-hover: #454d50;
  --bg-statusbar: linear-gradient(180deg, #2c3338 0%, #2a3236 100%);
  --bg-flyout: #2b2b2b;
  --bg-flyout-alt: #323232;
  --bg-card: #1f2020;
  --bg-input: #2d2d2d;
  --bg-input-hover: #333333;
  --bg-input-focus: #1b1b1b;
  --bg-dialog: #202020;
  --bg-hover: rgba(255, 255, 255, 0.06);
  --bg-pressed: rgba(255, 255, 255, 0.03);
  --bg-selected: rgba(255, 255, 255, 0.08);
  --fg: #e9e9e9;
  --fg-strong: #ffffff;
  --fg-dim: #a2a8ad;
  --fg-disabled: #6d6d6d;
  --border: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.16);
  --border-window: rgba(255, 255, 255, 0.08);
  --tab-separator: rgba(0, 0, 0, 0.35);
  --statusbar-fg: #b9c0c4;
  --gutter-fg: #6e767b;
  --gutter-fg-active: #c9d1d5;
  --accent: #0078d4;
  --accent-fg: #ffffff;
  --accent-soft: rgba(0, 120, 212, 0.28);
  --selection: rgba(0, 120, 212, 0.4);
  --current-line: rgba(255, 255, 255, 0.045);
  --find-hit: rgba(230, 180, 80, 0.35);
  --find-hit-active: rgba(230, 145, 60, 0.65);
  --warn: #e08a8a;
  --shadow-flyout: 0 8px 24px rgba(0, 0, 0, 0.55), 0 0 1px rgba(0, 0, 0, 0.9);
  --shadow-card: 0 6px 18px rgba(0, 0, 0, 0.45), 0 0 1px rgba(255, 255, 255, 0.12);
  --shadow-window: 0 18px 48px rgba(0, 0, 0, 0.6);
  --focus-ring: #ffffff;
}

:root[data-theme='light'] {
  --bg-window: #f5f5f5;
  --bg-editor: #f5f5f5;
  --bg-strip: linear-gradient(180deg, #e3e7e8 0%, #dde1e3 88%, #d8dcde 100%);
  --bg-tab-active: #ebeded;
  --bg-tab-inactive: #e8eced;
  --bg-tab-hover: #f2f4f5;
  --bg-statusbar: linear-gradient(180deg, #d6d8dc 0%, #dfe3e6 100%);
  --bg-flyout: #f9f9f9;
  --bg-flyout-alt: #f2f2f2;
  --bg-card: #f7f7f7;
  --bg-input: #ffffff;
  --bg-input-hover: #fbfbfb;
  --bg-input-focus: #ffffff;
  --bg-dialog: #f3f3f3;
  --bg-hover: rgba(0, 0, 0, 0.04);
  --bg-pressed: rgba(0, 0, 0, 0.02);
  --bg-selected: rgba(0, 0, 0, 0.05);
  --fg: #1b1b1b;
  --fg-strong: #000000;
  --fg-dim: #5d6266;
  --fg-disabled: #9a9a9a;
  --border: rgba(0, 0, 0, 0.09);
  --border-strong: rgba(0, 0, 0, 0.2);
  --border-window: rgba(0, 0, 0, 0.16);
  --tab-separator: rgba(0, 0, 0, 0.12);
  --statusbar-fg: #4c5155;
  --gutter-fg: #909599;
  --gutter-fg-active: #3d4145;
  --accent: #0078d4;
  --accent-fg: #ffffff;
  --accent-soft: rgba(0, 120, 212, 0.2);
  --selection: rgba(0, 120, 212, 0.28);
  --current-line: rgba(0, 0, 0, 0.035);
  --find-hit: rgba(235, 190, 80, 0.55);
  --find-hit-active: rgba(235, 145, 60, 0.75);
  --warn: #b0403c;
  --shadow-flyout: 0 8px 24px rgba(0, 0, 0, 0.22), 0 0 1px rgba(0, 0, 0, 0.2);
  --shadow-card: 0 6px 18px rgba(0, 0, 0, 0.16), 0 0 1px rgba(0, 0, 0, 0.18);
  --shadow-window: 0 18px 48px rgba(0, 0, 0, 0.25);
  --focus-ring: #1b1b1b;
}

/* ------------------------------- base / reset ------------------------------- */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: var(--font-ui);
  font-size: var(--font-size-ui);
  color: var(--fg);
  background: var(--bg-window);
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

body.transparent { background: transparent; }

.ico { display: block; flex: none; }
.hidden { display: none !important; }

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  border: 1px solid var(--border-window);
  background: var(--bg-window);
  overflow: hidden;
}

body.transparent #app { background: var(--bg-window-translucent, rgba(31, 34, 37, 0.72)); }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
button:focus-visible,
input:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
}

/* ------------------------------- title bar ---------------------------------- */
.titlebar {
  height: var(--titlebar-h);
  flex: none;
  display: flex;
  align-items: flex-end;
  background: var(--bg-strip);
  border-bottom: 1px solid var(--tab-separator);
  position: relative;
}

.menu-btn {
  width: 34px;
  height: var(--tab-h);
  margin: 3px 2px 3px 3px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-sm);
  color: var(--fg);
  flex: none;
  align-self: flex-start;
  margin-top: 3px;
}
.menu-btn:hover { background: var(--bg-hover); }
.menu-btn:active { background: var(--bg-pressed); }
.menu-btn.open { background: var(--bg-selected); }

.tabstrip {
  display: flex;
  align-items: flex-end;
  /* Shrinks when there are many tabs, but never grows: the `+` button must sit
     right after the last tab and the flexible spacer takes the remaining room. */
  flex: 0 1 auto;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  height: 100%;
}
.tabstrip::-webkit-scrollbar { display: none; }

.tab {
  height: var(--tab-h);
  flex: 0 1 auto;
  min-width: 104px;
  max-width: 232px;
  padding: 0 6px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-tab-inactive);
  color: var(--fg-dim);
  border-radius: 6px 6px 0 0;
  border-right: 1px solid var(--tab-separator);
  position: relative;
  cursor: default;
  animation: tabIn 140ms var(--ease);
  transition: background 120ms linear;
}
@keyframes tabIn { from { opacity: 0; transform: translateY(3px); } }
.tab:hover { background: var(--bg-tab-hover); }
.tab.active {
  background: var(--bg-tab-active);
  color: var(--fg-strong);
  border-right-color: transparent;
  z-index: 2;
}
.tab.active + .tab { border-left-color: transparent; }
.tab.dragging { opacity: 0.5; }
.tab.drop-before::before,
.tab.drop-after::after {
  content: '';
  position: absolute;
  top: 3px;
  bottom: 3px;
  width: 2px;
  background: var(--accent);
  border-radius: 1px;
}
.tab.drop-before::before { left: -1px; }
.tab.drop-after::after { right: -1px; }

.tab-icon { display: grid; place-items: center; opacity: 0.95; }
.tab-title {
  flex: 1 1 auto;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12px;
}
.tab-close {
  width: 20px;
  height: 20px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  color: inherit;
  flex: none;
  opacity: 0;
  transition: opacity 100ms linear, background 100ms linear;
}
.tab:hover .tab-close,
.tab.active .tab-close,
.tab.modified .tab-close { opacity: 1; }
.tab-close:hover { background: var(--bg-hover); }
.tab.modified .tab-close .ico { display: none; }
.tab-close .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  display: none;
}
.tab.modified .tab-close .dot { display: block; }
.tab.modified .tab-close:hover .dot { display: none; }
.tab.modified .tab-close:hover .ico { display: block; }

.new-tab-btn {
  width: 30px;
  height: var(--tab-h);
  margin: 0 4px 0 6px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-sm);
  color: var(--fg);
  flex: none;
  align-self: center;
}
.new-tab-btn:hover { background: var(--bg-hover); }

.titlebar-spacer {
  flex: 1 1 auto;
  height: 100%;
  min-width: 12px;
}

.window-controls { display: flex; height: 100%; align-items: stretch; flex: none; }
.win-btn {
  width: 46px;
  display: grid;
  place-items: center;
  color: var(--fg);
  transition: background 100ms linear;
}
.win-btn:hover { background: var(--bg-hover); }
.win-btn.close:hover { background: #c42b1c; color: #fff; }

/* --------------------------------- menus ------------------------------------ */
.flyout {
  position: fixed;
  z-index: 60;
  min-width: 260px;
  padding: 4px;
  background: var(--bg-flyout);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-flyout);
  animation: flyoutIn 110ms var(--ease);
  max-height: calc(100vh - 24px);
  overflow-y: auto;
}
@keyframes flyoutIn { from { opacity: 0; transform: translateY(-6px); } }

.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-size: 12px;
  text-align: left;
  position: relative;
}
.menu-item:hover:not(.disabled) { background: var(--bg-hover); }
.menu-item:active:not(.disabled) { background: var(--bg-pressed); }
.menu-item.disabled { color: var(--fg-disabled); cursor: default; }
.menu-item .label { flex: 1 1 auto; white-space: nowrap; }
.menu-item .keys {
  color: var(--fg-dim);
  font-size: 11px;
  padding-left: 18px;
  white-space: nowrap;
}
.menu-item .ico { color: inherit; opacity: 0.9; }
.menu-sep { height: 1px; margin: 4px 8px; background: var(--border); }
.menu-item.has-sub::after { content: ''; display: none; }

/* ------------------------------- find / replace ----------------------------- */
.find-card {
  position: absolute;
  top: 8px;
  right: 16px;
  z-index: 40;
  width: 344px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  animation: flyoutIn 120ms var(--ease);
  overflow: hidden;
}
.find-row { display: flex; align-items: center; gap: 4px; padding: 5px 6px; }
.find-row + .find-row { border-top: 1px solid var(--border); }
.find-input {
  flex: 1 1 auto;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: none;
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 12px;
  padding: 5px 4px;
}
.find-input::placeholder { color: var(--fg-dim); }
.find-status {
  font-size: 11px;
  color: var(--fg-dim);
  padding: 0 6px;
  white-space: nowrap;
}
.find-status.error { color: var(--warn); }
.icon-btn {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-sm);
  color: var(--fg);
}
.icon-btn:hover:not(:disabled) { background: var(--bg-hover); }
.icon-btn:active:not(:disabled) { background: var(--bg-pressed); }
.icon-btn:disabled { color: var(--fg-disabled); cursor: default; }
.icon-btn.toggled { background: var(--bg-selected); color: var(--accent); }
.find-options {
  display: flex;
  gap: 4px;
  padding: 2px 6px 6px;
  flex-wrap: wrap;
}
.check-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--fg-dim);
  padding: 4px 8px;
  border-radius: 12px;
  border: 1px solid var(--border);
}
.check-chip:hover { background: var(--bg-hover); }
.check-chip.on { color: var(--fg); border-color: var(--border-strong); background: var(--bg-selected); }
.check-chip .box {
  width: 12px;
  height: 12px;
  border: 1px solid var(--fg-dim);
  border-radius: 2px;
  display: grid;
  place-items: center;
  font-size: 9px;
}
.check-chip.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

/* --------------------------------- editor ----------------------------------- */
.workspace { flex: 1 1 auto; display: flex; min-height: 0; position: relative; }

.editor {
  flex: 1 1 auto;
  display: flex;
  min-width: 0;
  min-height: 0;
  background: var(--bg-editor);
  position: relative;
  overflow: hidden;
}

.gutter {
  flex: none;
  width: 58px;
  overflow: hidden;
  padding: var(--editor-pad-y) 0;
  color: var(--gutter-fg);
  font-family: var(--font-mono);
  font-size: var(--editor-font-size, 13px);
  line-height: var(--editor-line-height, 1.5);
  text-align: right;
  user-select: none;
  position: relative;
}
.gutter.hidden { display: none; }
.gutter-lines { position: absolute; inset: var(--editor-pad-y) 0 auto 0; will-change: transform; }
.gutter-line {
  padding-right: var(--gutter-pad);
  white-space: nowrap;
  transition: color 80ms linear;
}
.gutter-line.current { color: var(--gutter-fg-active); }
.gutter-line.modified { border-right: 2px solid var(--accent); }

.panes { flex: 1 1 auto; min-width: 0; position: relative; }

.backdrop {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  contain: strict;
}
.backdrop-inner {
  position: absolute;
  top: var(--editor-pad-y);
  left: 0;
  right: 0;
  padding: 0 var(--editor-pad-x);
  font-family: var(--font-mono);
  font-size: var(--editor-font-size, 13px);
  line-height: var(--editor-line-height, 1.5);
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: break-word;
  color: transparent;
  will-change: transform;
}
.backdrop-inner.nowrap { white-space: pre; overflow-wrap: normal; word-break: normal; }
.backdrop mark {
  background: var(--find-hit);
  color: transparent;
  border-radius: 2px;
}
.backdrop mark.active { background: var(--find-hit-active); }

.current-line-band {
  position: absolute;
  left: 0;
  right: 0;
  height: 1.5em;
  background: var(--current-line);
  pointer-events: none;
  border: 0;
  display: none;
}
.current-line-band.on { display: block; }

textarea.buffer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  resize: none;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--fg);
  caret-color: var(--fg);
  padding: var(--editor-pad-y) var(--editor-pad-x);
  font-family: var(--font-mono);
  font-size: var(--editor-font-size, 13px);
  line-height: var(--editor-line-height, 1.5);
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: break-word;
  overflow: auto;
  tab-size: 4;
  user-select: text;
  -webkit-user-select: text;
}
textarea.buffer.nowrap {
  white-space: pre;
  overflow-wrap: normal;
  word-break: normal;
  overflow-x: auto;
}
textarea.buffer::selection { background: var(--selection); }
textarea.buffer[readonly] { caret-color: transparent; }

/* ------------------------------- status bar --------------------------------- */
.statusbar {
  height: var(--statusbar-h);
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 12px;
  background: var(--bg-statusbar);
  border-top: 1px solid var(--border);
  color: var(--statusbar-fg);
  font-size: var(--font-size-status);
}
.status-path {
  flex: 1 1 auto;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}
.status-right { display: flex; align-items: center; gap: 14px; flex: none; }
.status-item { white-space: nowrap; }
.status-item.btn { border-radius: var(--radius-sm); padding: 2px 6px; margin: 0 -6px; }
.status-item.btn:hover { background: var(--bg-hover); }
.status-modified { color: var(--warn); }
.status-item.accent-tint { color: var(--accent); }

/* ------------------------------- settings pane ------------------------------- */
.settings {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  background: var(--bg-window);
  animation: paneIn 160ms var(--ease);
}
@keyframes paneIn { from { opacity: 0; transform: translateX(24px); } }

.settings-rail {
  width: var(--settings-rail-w);
  flex: none;
  background: var(--bg-window);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 16px;
  gap: 4px;
  order: 2;
}
.rail-btn {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  color: var(--fg-dim);
  border-radius: var(--radius-sm);
  position: relative;
}
.rail-btn:hover { color: var(--fg); background: var(--bg-hover); }
.rail-btn.active { color: var(--fg-strong); }
.rail-btn.active::before {
  content: '';
  position: absolute;
  left: -6px;
  top: 8px;
  bottom: 8px;
  width: 3px;
  border-radius: 2px;
  background: var(--accent);
}
.settings-body {
  flex: 1 1 auto;
  min-width: 0;
  overflow-y: auto;
  padding: 22px 28px 40px;
  order: 1;
}
.settings-title {
  font-size: 26px;
  font-weight: 400;
  margin: 0 0 18px;
  color: var(--fg-strong);
  letter-spacing: -0.2px;
}
.settings-section { margin-bottom: 30px; }
.settings-section > h3 {
  font-size: 19px;
  font-weight: 400;
  margin: 0 0 14px;
  color: var(--fg-strong);
}
.settings-section > .hint {
  font-size: 11px;
  color: var(--fg-dim);
  margin-top: 8px;
  line-height: 1.5;
  max-width: 560px;
}
.field { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; min-height: 32px; }
.field > label { min-width: 190px; color: var(--fg); }
.field .grow { flex: 1 1 auto; }
.radio-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; }
.radio-row input { accent-color: var(--accent); width: 15px; height: 15px; }
.switch { position: relative; width: 40px; height: 20px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .track {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: transparent;
  transition: background 120ms linear, border-color 120ms linear;
  pointer-events: none;
}
.switch .knob {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--fg-dim);
  transition: transform 140ms var(--ease), background 120ms linear;
  pointer-events: none;
}
.switch input:checked ~ .track { background: var(--accent); border-color: var(--accent); }
.switch input:checked ~ .knob { transform: translateX(20px); background: var(--accent-fg); }
.switch input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 2px; }

input[type='range'] { accent-color: var(--accent); width: 220px; }
input[type='text'], input[type='number'], select, input[type='color'] {
  background: var(--bg-input);
  color: var(--fg);
  border: 1px solid var(--border-strong);
  border-bottom-color: var(--fg-dim);
  border-radius: var(--radius-sm);
  padding: 5px 8px;
  font: inherit;
  min-width: 120px;
}
input[type='text']:hover, select:hover, input[type='number']:hover { background: var(--bg-input-hover); }
input[type='number'] { width: 84px; min-width: 0; }
input[type='color'] { width: 46px; height: 30px; padding: 2px; min-width: 0; cursor: pointer; }

.swatch-grid { display: flex; flex-wrap: wrap; gap: 10px; max-width: 420px; margin: 6px 0 4px; }
.swatch {
  width: 27px;
  height: 27px;
  border-radius: var(--radius-md);
  border: 2px solid transparent;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
}
.swatch.selected { border-color: var(--fg-strong); outline: 2px solid var(--accent); outline-offset: 1px; }
.accent-foot { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.accent-preview {
  width: 52px;
  height: 30px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
}
.btn {
  padding: 5px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-input);
  color: var(--fg);
  font-size: 12px;
}
.btn:hover { background: var(--bg-input-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { color: var(--fg-disabled); }

.about-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg-card);
  padding: 16px 18px;
  max-width: 620px;
}
.about-card h4 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
.about-card p { margin: 0 0 10px; color: var(--fg-dim); line-height: 1.55; }
.about-card dl { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; margin: 0; }
.about-card dt { color: var(--fg-dim); }
.about-card dd { margin: 0; }
.kbd {
  font-family: var(--font-mono);
  font-size: 10.5px;
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 1px 4px;
  background: var(--bg-input);
}

/* --------------------------------- dialogs ---------------------------------- */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(0, 0, 0, 0.35);
  display: grid;
  place-items: center;
  animation: fadeIn 100ms linear;
}
@keyframes fadeIn { from { opacity: 0; } }
.dialog {
  width: 430px;
  max-width: calc(100vw - 40px);
  background: var(--bg-dialog);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-window);
  overflow: hidden;
  animation: dialogIn 140ms var(--ease);
}
@keyframes dialogIn { from { opacity: 0; transform: scale(0.96); } }
.dialog-head { padding: 22px 24px 10px; font-size: 19px; font-weight: 400; color: var(--fg-strong); }
.dialog-body { padding: 0 24px 22px; line-height: 1.55; color: var(--fg); }
.dialog-body .detail { color: var(--fg-dim); margin-top: 8px; font-size: 11.5px; }
.dialog-foot {
  display: flex;
  gap: 8px;
  padding: 22px 24px;
  background: var(--bg-flyout-alt);
  border-top: 1px solid var(--border);
}
.dialog-foot .btn { flex: 1 1 0; text-align: center; padding: 7px 12px; }
.dialog-list { margin: 10px 0 0; padding-left: 18px; max-height: 180px; overflow-y: auto; }
.dialog-list li { margin-bottom: 4px; font-family: var(--font-mono); font-size: 11px; }

/* ---------------------------- toast notifications ---------------------------- */
.toast-host {
  position: fixed;
  right: 16px;
  bottom: 44px;
  z-index: 70;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;
}
.toast {
  background: var(--bg-flyout);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  padding: 10px 14px;
  min-width: 240px;
  max-width: 380px;
  font-size: 12px;
  animation: toastIn 160ms var(--ease);
}
.toast.warn { border-left-color: var(--warn); }
.toast .toast-title { font-weight: 600; margin-bottom: 2px; }
.toast .toast-text { color: var(--fg-dim); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }
.toast.out { animation: toastOut 140ms linear forwards; }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }

/* ------------------------------ misc surfaces ------------------------------- */
.binary-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  background: var(--bg-editor);
  text-align: center;
  padding: 32px;
}
.binary-overlay .inner { max-width: 420px; }
.binary-overlay h2 { font-weight: 400; font-size: 20px; margin: 0 0 10px; color: var(--fg-strong); }
.binary-overlay p { color: var(--fg-dim); line-height: 1.6; margin: 0 0 18px; }
.binary-overlay .actions { display: flex; gap: 8px; justify-content: center; }

.drop-hint {
  position: absolute;
  inset: 8px;
  z-index: 50;
  border: 2px dashed var(--accent);
  border-radius: var(--radius-lg);
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  display: grid;
  place-items: center;
  font-size: 15px;
  color: var(--fg-strong);
  pointer-events: none;
}

.diff-view {
  position: absolute;
  inset: 0;
  z-index: 25;
  background: var(--bg-editor);
  display: flex;
  flex-direction: column;
}
.diff-view header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--fg-dim);
}
.diff-view .cols { flex: 1 1 auto; display: flex; min-height: 0; }
.diff-view .col { flex: 1 1 0; min-width: 0; overflow: auto; padding: 6px 0; }
.diff-view .col + .col { border-left: 1px solid var(--border); }
.diff-view .col h4 { margin: 0 8px 6px; font-size: 11px; font-weight: 600; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.4px; }
.diff-line {
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.55;
  padding: 0 10px;
  white-space: pre-wrap;
  overflow-wrap: break-word;

.diff-line.add { background: rgba(70, 160, 90, 0.22); }
.diff-line.del { background: rgba(200, 70, 70, 0.22); }
.diff-line.pad { background: var(--bg-hover); }
.diff-line .num {
  display: inline-block;
  width: 34px;
  color: var(--gutter-fg);
  user-select: none;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }

      const prev = this.text;
      this.text = b.value;
      this.#recomputeLines();
      this.#pushUndo(prev, 'insert');
      this.#refresh({ textChanged: true });
      this.hooks.onInput?.();
    });

    const cursor = () => {
      this.#refreshCursor();
      this.hooks.onCursor?.(this.cursorInfo());
    };
    b.addEventListener('keyup', cursor);
    b.addEventListener('click', cursor);
    b.addEventListener('select', cursor);

    b.addEventListener('scroll', () => {
      this.syncScroll();
      this.hooks.onScroll?.(this.getScroll());
    });

    // Keep the mirrored layers glued to the native scroll.
    b.addEventListener('keydown', (e) => this.#handleKey(e));
  }

  #handleKey(e) {
    // Tab inserts a real tab character instead of moving focus, like the original.
    if (e.key === 'Tab' && !e.ctrlKey && !e.altKey && !e.metaKey && !this.readonly) {
      e.preventDefault();
      this.insertText('\t', { undoable: true, kind: 'tab' });
      return;
    }
    // Alt+Z toggles word wrap (original shortcut).
    if (e.altKey && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      this.setWrap(!this.settings.wrap);
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && this.readonly) {
      e.preventDefault();
      this.opts?.onToggleReadonly?.();
    }
  }

  // --------------------------------------------------------------- geometry

  get lineHeightPx() {
    const cs = getComputedStyle(this.el.buffer);
    const size = parseFloat(cs.fontSize) || this.settings.fontSize || 13;
    let lh = parseFloat(cs.lineHeight);
    if (Number.isNaN(lh)) lh = size * (this.settings.lineHeight || 1.5);
    return lh;
  }

  get padY() {
    return parseFloat(getComputedStyle(this.el.buffer).paddingTop) || 0;
  }

  get scrollbarWidth() {
    const b = this.el.buffer;
    return Math.max(0, b.offsetWidth - b.clientWidth - (this.#borderX(b) || 0));
  }

  #borderX(el) {
    const cs = getComputedStyle(el);
    return (parseFloat(cs.borderLeftWidth) || 0) + (parseFloat(cs.borderRightWidth) || 0);
  }

  // -------------------------------------------------------------- documents

  /** Loads a document state into the view (used when switching tabs). */
  load(state) {
    this.text = state.text ?? '';
    this.undoStack = state.undo || [];
    this.redoStack = state.redo || [];
    this.lastUndoPush = 0;
    this.activeMatch = -1;
    this.el.buffer.value = this.text;
    this.readonly = !!state.readonly;
    this.el.buffer.readOnly = this.readonly;
    this.#recomputeLines();
    this.#refresh({ textChanged: true });
    this.el.buffer.scrollTop = state.scrollTop || 0;
    this.el.buffer.scrollLeft = state.scrollLeft || 0;
    this.syncScroll();
    const start = state.selStart ?? 0;
    const end = state.selEnd ?? start;
    this.setSelection(start, end, { scrollIntoView: false, silent: true });
    if (state.search) this.setSearch(state.search, { silent: true });
  }

  /** Extracts the mutable state back into the tab object. */
  save(state) {
    state.text = this.text;
    state.undo = this.undoStack;
    state.redo = this.redoStack;
    state.scrollTop = this.el.buffer.scrollTop;
    state.scrollLeft = this.el.buffer.scrollLeft;
    state.selStart = this.el.buffer.selectionStart;
    state.selEnd = this.el.buffer.selectionEnd;
    state.search = { ...this.search };
    return state;
  }

  setReadonly(flag) {
    this.readonly = !!flag;
    this.el.buffer.readOnly = this.readonly;
  }

  // ------------------------------------------------------------- text edits

  getValue() {
    return this.text;
  }

  setValue(text, { keepCursor = false, resetUndo = false } = {}) {
    const prev = this.text;
    if (resetUndo) {
      this.undoStack = [];
      this.redoStack = [];
    } else {
      this.#pushUndo(prev, 'setValue');
    }
    this.text = text;
    this.el.buffer.value = text;
    if (!keepCursor) this.el.buffer.setSelectionRange(0, 0);
    this.#recomputeLines();
    this.#refresh({ textChanged: true });
    this.#refreshCursor();
    this.hooks.onInput?.();
  }

  /** Replaces the current selection (or inserts at the caret). */
  insertText(str, { kind = 'insert' } = {}) {
    if (this.readonly) return;
    const b = this.el.buffer;
    const prev = this.text;
    const start = b.selectionStart;
    const end = b.selectionEnd;
    const next = prev.slice(0, start) + str + prev.slice(end);

    // Native undo is disabled on purpose: we own the history so that
    // programmatic edits and keystrokes share one stack.
    b.value = next;
    this.text = next;
    const caret = start + str.length;
    b.setSelectionRange(caret, caret);
    this.#pushUndo(prev, kind);
    this.#recomputeLines();
    this.#refresh({ textChanged: true });
    this.#refreshCursor();
    this.hooks.onInput?.();
  }

  replaceRange(start, end, str, { kind = 'replace', select = false } = {}) {
    if (this.readonly) return;
    const b = this.el.buffer;
    const prev = this.text;
    const next = prev.slice(0, start) + str + prev.slice(end);
    b.value = next;
    this.text = next;
    if (select) b.setSelectionRange(start, start + str.length);
    else {
      const caret = start + str.length;
      b.setSelectionRange(caret, caret);
    }
    this.#pushUndo(prev, kind);
    this.#recomputeLines();
    this.#refresh({ textChanged: true });
    this.#refreshCursor();
    this.hooks.onInput?.();
  }

  #pushUndo(prevText, kind) {
    if (prevText === this.text) return;
    const now = performance.now();
    const coalesce =
      this.undoStack.length > 0 &&
      now - this.lastUndoPush < 700 &&
      kind === 'insert' &&
      this.lastInputKind === 'insert';
    if (coalesce) {
      this.undoStack[this.undoStack.length - 1].at = now;
    } else {
      this.undoStack.push({
        text: prevText,
        selStart: this.el.buffer.selectionStart,
        selEnd: this.el.buffer.selectionEnd,
        at: now,
      });
      if (this.undoStack.length > 300) this.undoStack.shift();
    }
    this.redoStack = [];
    this.lastUndoPush = now;
    this.lastInputKind = kind;
    this.hooks.onUndoState?.(this.undoStack.length > 0, this.redoStack.length > 0);
  }

  undo() {
    const entry = this.undoStack.pop();
    if (!entry) return false;
    this.redoStack.push({
      text: this.text,
      selStart: this.el.buffer.selectionStart,
      selEnd: this.el.buffer.selectionEnd,
      at: performance.now(),
    });
    this.text = entry.text;
    this.el.buffer.value = entry.text;
    this.el.buffer.setSelectionRange(entry.selStart ?? 0, entry.selEnd ?? 0);
    this.#recomputeLines();
    this.#refresh({ textChanged: true });
    this.hooks.onInput?.();
    this.hooks.onUndoState?.(this.undoStack.length > 0, true);
    return true;
  }

  redo() {
    const entry = this.redoStack.pop();
    if (!entry) return false;
    this.undoStack.push({
      text: this.text,
      selStart: this.el.buffer.selectionStart,
      selEnd: this.el.buffer.selectionEnd,
      at: performance.now(),
    });
    this.text = entry.text;
    this.el.buffer.value = entry.text;
    this.el.buffer.setSelectionRange(entry.selStart ?? 0, entry.selEnd ?? 0);
    this.#recomputeLines();
    this.#refresh({ textChanged: true });
    this.hooks.onInput?.();
    this.hooks.onUndoState?.(true, this.redoStack.length > 0);
    return true;
  }

  // --------------------------------------------------------------- selection

  setSelection(start, end = start, { scrollIntoView = true, silent = false } = {}) {
    const b = this.el.buffer;
    const len = this.text.length;
    b.setSelectionRange(clamp(start, 0, len), clamp(end, 0, len));
    if (scrollIntoView) this.scrollCaretIntoView();
    this.#refreshCursor();
    if (!silent) this.hooks.onCursor?.(this.cursorInfo());
  }

  selectAll() {
    this.setSelection(0, this.text.length);
  }

  get selectionRange() {
    const b = this.el.buffer;
    return { start: b.selectionStart, end: b.selectionEnd };
  }

  /** Line / column / selection size, in the exact wording of the original app. */
  cursorInfo() {
    const b = this.el.buffer;
    const pos = b.selectionEnd;
    const line = this.#lineIndexAt(pos);
    const col = pos - this.lineStarts[line] + 1;
    const selLen = Math.abs(b.selectionEnd - b.selectionStart);
    return { line: line + 1, col, selected: selLen, lineCount: this.lineStarts.length };
  }

  goToLine(lineNumber) {
    const idx = clamp(lineNumber - 1, 0, this.lineStarts.length - 1);
    this.setSelection(this.lineStarts[idx], this.lineStarts[idx]);
    this.scrollCaretIntoView();
  }

  // ------------------------------------------------------------------ search

  /**
   * Recomputes the hit list. Returns `{count, error}`; `error` is a message when
   * a regex does not compile (the original shows InvalidRegularExpression).
   */
  setSearch(opts, { silent = false } = {}) {
    this.search = { ...this.search, ...opts };
    const { query, matchCase, wholeWord, regex, active } = this.search;
    this.matches = [];
    this.activeMatch = -1;
    let error = null;

    if (active && query) {
      if (regex) {
        try {
          const base = matchCase ? query : query;
          const re = new RegExp(base, matchCase ? 'gm' : 'gim');
          this.matches = this.#collectRegex(re, wholeWord);
        } catch (e) {
          error = String(e.message || e);
        }
      } else {
        this.matches = this.#collectLiteral(query, matchCase, wholeWord);
      }
    }

    if (this.matches.length) {
      // Start from the first hit at or after the caret.
      const caret = this.el.buffer.selectionStart;
      const idx = this.matches.findIndex((m) => m.start >= caret);
      this.activeMatch = idx === -1 ? 0 : idx;
    }

    this.#refresh({ textChanged: false });
    if (!silent) this.#scrollActiveMatchIntoView();
    return { count: this.matches.length, error };
  }

  #collectLiteral(query, matchCase, wholeWord) {
    const hay = matchCase ? this.text : this.text.toLowerCase();
    const needle = matchCase ? query : query.toLowerCase();
    const out = [];
    if (!needle) return out;
    let from = 0;
    for (;;) {
      const i = hay.indexOf(needle, from);
      if (i === -1) break;
      const end = i + needle.length;
      if (!wholeWord || this.#isWordBoundary(i, end)) out.push({ start: i, end });
      from = i + Math.max(1, needle.length);
      if (out.length > 200000) break;
    }
    return out;
  }

  #collectRegex(re, wholeWord) {
    const out = [];
    let m;
    let guard = 0;
    while ((m = re.exec(this.text)) !== null && guard++ < 200000) {
      const start = m.index;
      const end = start + m[0].length;
      if (m[0].length === 0) {
        re.lastIndex = start + 1;
        continue;
      }
      if (!wholeWord || this.#isWordBoundary(start, end)) out.push({ start, end });
    }
    return out;
  }

  #isWordBoundary(start, end) {
    const isWord = (c) => !!c && /[\w\u00C0-\u024F]/.test(c);
    return !isWord(this.text[start - 1]) && !isWord(this.text[end]);
  }

  findNext(dir = 1) {
    if (!this.matches.length) return false;
    this.activeMatch = (this.activeMatch + dir + this.matches.length) % this.matches.length;
    this.#refresh({ textChanged: false });
    this.#scrollActiveMatchIntoView();
    return true;
  }

  get activeMatchIndex() {
    return this.activeMatch;
  }

  replaceCurrent(replacement) {
    if (this.activeMatch < 0 || !this.matches.length) return false;
    const m = this.matches[this.activeMatch];
    this.replaceRange(m.start, m.end, replacement, { kind: 'replace' });
    this.setSearch({}, { silent: true });
    return true;
  }

  replaceAll(replacement) {
    if (!this.matches.length) return 0;
    const matches = [...this.matches];
    let next = this.text;
    for (let i = matches.length - 1; i >= 0; i--) {
      const m = matches[i];
      next = next.slice(0, m.start) + replacement + next.slice(m.end);
    }
    const count = matches.length;
    this.setValue(next, { keepCursor: true });
    this.setSearch({}, { silent: true });
    return count;
  }

  #scrollActiveMatchIntoView() {
    const m = this.matches[this.activeMatch];
    if (!m) return;
    const line = this.#lineIndexAt(m.start);
    this.scrollLineIntoView(line, m.end);
  }

  scrollLineIntoView(lineIdx, caretPos) {
    const b = this.el.buffer;
    const lh = this.lineHeightPx;
    let top;
    if (!this.settings.wrap) {
      top = this.padY + lineIdx * lh;
      const view = b.clientHeight;
      if (top - b.scrollTop < 0) b.scrollTop = top - this.padY;
      else if (top + lh - b.scrollTop > view) b.scrollTop = top + lh - view + this.padY;
    } else {
      const el = this.el.backdropInner.children[lineIdx];
      if (el) {
        top = el.offsetTop;
        const view = b.clientHeight;
        if (top - b.scrollTop < 0) b.scrollTop = top - lh;
        else if (top + el.offsetHeight - b.scrollTop > view) {
          b.scrollTop = top + el.offsetHeight - view + lh * 0.5;
        }
      }
    }
    // Horizontal: only when wrapping is off can a long line hide the caret.
    if (!this.settings.wrap && caretPos != null) {
      const after = this.text.slice(this.lineStarts[lineIdx], caretPos);
      const width = this.#measureWidth(after);
      const view = b.clientWidth;
      if (width - b.scrollLeft > view - 40) b.scrollLeft = width - view + 60;
      else if (width < b.scrollLeft) b.scrollLeft = 0;
    }
    this.syncScroll();
  }

  #measure(widthOf) {
    if (!this._measureEl) {
      const el = document.createElement('span');
      el.style.cssText =
        'position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0;pointer-events:none';
      document.body.appendChild(el);
      this._measureEl = el;
    }
    const cs = getComputedStyle(this.el.buffer);
    this._measureEl.style.font = cs.font;
    this._measureEl.style.fontFamily = cs.fontFamily;
    this._measureEl.style.fontSize = cs.fontSize;
    this._measureEl.style.letterSpacing = cs.letterSpacing;
    this._measureEl.style.tabSize = this.settings.tabSize;
    return widthOf;
  }

  #measureWidth(str) {
    const el = this.#measureElFor(str);
    el.textContent = str;
    return el.getBoundingClientRect().width;
  }

  #measureElFor() {
    if (!this._measureEl) {
      const el = document.createElement('span');
      el.style.cssText =
        'position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0;pointer-events:none';
      document.body.appendChild(el);
      this._measureEl = el;
    }
    const cs = getComputedStyle(this.el.buffer);
    this._measureEl.style.fontFamily = cs.fontFamily;
    this._measureEl.style.fontSize = cs.fontSize;
    this._measureEl.style.letterSpacing = cs.letterSpacing;
    this._measureEl.style.tabSize = this.settings.tabSize;
    return this._measureEl;
  }

  scrollCaretIntoView() {
    const info = this.cursorInfo();
    this.scrollLineIntoView(info.line - 1, this.el.buffer.selectionEnd);
  }

  // ------------------------------------------------------------------ render

  #recomputeLines() {
    const starts = [0];
    const t = this.text;
    for (let i = 0; i < t.length; i++) {
      if (t.charCodeAt(i) === 10) starts.push(i + 1);
    }
    this.lineStarts = starts;
  }

  #lineIndexAt(pos) {
    let lo = 0;
    let hi = this.lineStarts.length - 1;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (this.lineStarts[mid] <= pos) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  }

  get lineCount() {
    return this.lineStarts.length;
  }

  getLine(i) {
    const start = this.lineStarts[i];
    if (start == null) return '';
    const end = i + 1 < this.lineStarts.length ? this.lineStarts[i + 1] - 1 : this.text.length;
    return this.text.slice(start, end);
  }

  /** True when the mirrored backdrop has to exist (search hits or wrapped lines). */
  get #needsBackdrop() {
    return this.search.active || this.settings.wrap || this.text.length < 400000;
  }

  #refresh({ textChanged }) {
    const b = this.el.buffer;
    b.classList.toggle('nowrap', !this.settings.wrap);
    this.el.backdropInner.classList.toggle('nowrap', !this.settings.wrap);
    b.style.tabSize = String(this.settings.tabSize);
    this.el.backdropInner.style.tabSize = String(this.settings.tabSize);

    // Scrollbar compensation: the textarea loses width to its scrollbar, the
    // backdrop must lose exactly the same so wrapped lines break in the same spot.
    const sb = this.scrollbarWidth;
    this.el.backdropInner.style.paddingRight = `calc(var(--editor-pad-x) + ${sb}px)`;

    if (this.#needsBackdrop) this.#renderBackdrop();
    else this.el.backdropInner.textContent = '';

    this.#renderGutter();
    this.#updateBand();
    this.syncScroll();
    if (textChanged) this.hooks.onUndoState?.(this.undoStack.length > 0, this.redoStack.length > 0);
  }

  #renderBackdrop() {
    const inner = this.el.backdropInner;
    const matches = this.search.active && this.search.query && !this.matches.length ? [] : this.matches;
    const byLineStart = matches.length ? this.#matchesByLine(matches) : null;
    const lines = this.lineStarts.length;
    const chunks = new Array(lines);

    for (let i = 0; i < lines; i++) {
      const start = this.lineStarts[i];
      const end = i + 1 < lines ? this.lineStarts[i + 1] - 1 : this.text.length;
      const lineText = this.text.slice(start, end);
      const lineMatches = byLineStart?.get(i);
      if (!lineMatches || !lineMatches.length) {
        chunks[i] = `<div class="ln">${escHtml(lineText) || '&#8203;'}</div>`;
        continue;
      }
      let html = '';
      let cursor = 0;
      for (const m of lineMatches) {
        const s = m.start - start;
        const e = m.end - start;
        if (s > cursor) html += escHtml(lineText.slice(cursor, s));
        html += `<mark class="${m.index === this.activeMatch ? 'active' : ''}">${escHtml(
          lineText.slice(s, e),
        )}</mark>`;
        cursor = e;
      }
      html += escHtml(lineText.slice(cursor));
      chunks[i] = `<div class="ln">${html || '&#8203;'}</div>`;
    }
    // A single innerHTML write keeps large documents to one reflow.
    inner.innerHTML = chunks.join('');
  }

  /** Groups hits by line and clamps multi-line regex hits into each line. */
  #matchesByLine(matches) {
    const map = new Map();
    matches.forEach((m, index) => {
      let lineIdx = this.#lineIndexAt(m.start);
      let cursor = m.start;
      for (;;) {
        const lineEnd =
          lineIdx + 1 < this.lineStarts.length ? this.lineStarts[lineIdx + 1] - 1 : this.text.length;
        map.set(lineIdx, map.get(lineIdx) || []);
        map.get(lineIdx).push({
          start: cursor,
          end: Math.min(m.end, lineEnd),
          index,
        });
        if (m.end <= lineEnd) break;
        lineIdx++;
        cursor = lineEnd + 1;
      }
    });
    return map;
  }

  #renderGutter() {
    const g = this.el.gutterLines;
    const n = this.lineStarts.length;
    if (!this.settings.lineNumbers) {
      g.textContent = '';
      this.el.gutter.classList.add('hidden');
      return;
    }
    this.el.gutter.classList.remove('hidden');
    const lh = this.lineHeightPx;
    const scrollTop = this.el.buffer.scrollTop;
    const viewH = this.el.buffer.clientHeight;
    const current = this.#lineIndexAt(this.el.buffer.selectionEnd);

    if (!this.settings.wrap) {
      // Exact arithmetic: with wrapping off every line is exactly one row tall.
      const first = Math.max(0, Math.floor((scrollTop - this.padY) / lh) - 1);
      const last = Math.min(n - 1, Math.ceil((scrollTop + viewH) / lh) + 1);
      let html = '';
      for (let i = first; i <= last; i++) {
        html += `<div class="gutter-line ${i === current ? 'current' : ''}">${i + 1}</div>`;
      }
      g.innerHTML = html;
      g.style.transform = `translateY(${scrollTop}px)`;
      g.dataset.first = String(first);
    } else {
      // Wrapping on: y positions come from the measured backdrop blocks.
      const blocks = this.el.backdropInner.children;
      let html = '';
      for (let i = 0; i < blocks.length; i++) {
        const blk = blocks[i];
        const top = blk.offsetTop;
        if (top > scrollTop + viewH) break;
        if (top + blk.offsetHeight < scrollTop) continue;
        html += `<div class="gutter-line ${i === current ? 'current' : ''}" style="height:${
          blk.offsetHeight
        }px">${i + 1}</div>`;
      }
      g.innerHTML = html;
      g.style.transform = `translateY(${scrollTop}px)`;
    }
  }

  #updateBand() {
    const band = this.el.band;
    if (!this.settings.highlightCurrentLine || this.readonly) {
      band.classList.remove('on');
      return;
    }
    const lineIdx = this.#lineIndexAt(this.el.buffer.selectionEnd);
    const lh = this.lineHeightPx;
    let top;
    let height = lh;
    if (!this.settings.wrap) {
      top = this.padY + lineIdx * lh;
    } else {
      const blk = this.el.backdropInner.children[lineIdx];
      if (!blk) {
        band.classList.remove('on');
        return;
      }
      top = blk.offsetTop;
      height = blk.offsetHeight;
    }
    band.classList.add('on');
    band.style.height = `${height}px`;
    band.style.transform = `translateY(${top - this.el.buffer.scrollTop}px)`;
  }

  /** Mirrors the native scroll into the backdrop, gutter and line band. */
  syncScroll() {
    const b = this.el.buffer;
    this.el.backdropInner.style.transform = `translate(${-b.scrollLeft}px, ${-b.scrollTop}px)`;
    if (!this.settings.wrap) {
      this.el.gutterLines.style.transform = `translateY(${b.scrollTop}px)`;
    } else {
      this.el.gutterLines.style.transform = `translateY(${b.scrollTop}px)`;
    }
    this.#updateBand();
    if (this.settings.wrap && this.settings.lineNumbers) this.#renderGutter();
  }

  #refreshCursor() {
    this.#updateBand();
    if (this.settings.wrap && this.settings.lineNumbers) this.#renderGutter();
  }

  // ---------------------------------------------------------------- settings

  applySettings(s) {
    Object.assign(this.settings, s);
    const style = this.root.style;
    style.setProperty('--editor-font-size', `${this.settings.fontSize}px`);
    style.setProperty('--editor-line-height', String(this.settings.lineHeight));
    const family =
      this.settings.fontFamily === 'mono'
        ? 'var(--font-mono)'
        : this.settings.fontFamily === 'serif'
          ? 'Georgia, "Noto Serif", "DejaVu Serif", serif'
          : '"NotepadsUI", system-ui, sans-serif';
    this.el.buffer.style.fontFamily = family;
    this.el.backdropInner.style.fontFamily = family;
    this.el.gutter.style.fontFamily = family;
    this.#refresh({ textChanged: false });
    this.syncScroll();
  }

  setWrap(flag) {
    this.settings.wrap = !!flag;
    this.#refresh({ textChanged: false });
    this.#refreshCursor();
    return this.settings.wrap;
  }

  setLineNumbers(flag) {
    this.settings.lineNumbers = !!flag;
    this.#refresh({ textChanged: false });
    return this.settings.lineNumbers;
  }

  setHighlightCurrentLine(flag) {
    this.settings.highlightCurrentLine = !!flag;
    this.#updateBand();
  }

  setZoom(delta, min = 8, max = 60) {
    this.settings.fontSize = clamp(this.settings.fontSize + delta, min, max);
    this.applySettings({});
    return this.settings.fontSize;
  }

  resetZoom() {
    this.settings.fontSize = 13;
    this.applySettings({});
    return this.settings.fontSize;
  }

  focus() {
    this.el.buffer.focus();
  }

  getScroll() {
    return { top: this.el.buffer.scrollTop, left: this.el.buffer.scrollLeft };
  }
}

/* ============================== bridge.js ============================== */
/**
 * bridge.js — the only module that knows whether we are running inside Tauri or
 * inside a plain browser.
 *
 * Under Tauri every call goes to the Rust commands in src-tauri/src/lib.rs
 * (real filesystem, real encodings, real dialogs). In a browser it degrades to
 * the File System Access API / <input type=file> / downloads plus localStorage,
 * which is exactly what the hosted demo build uses. The rest of the UI code is
 * identical in both cases.
 */

const T = globalThis.__TAURI__;
const isTauri = !!(T && T.core && typeof T.core.invoke === 'function');

const ws = (() => {
  try {
    return T?.window?.getCurrentWindow ? T.window.getCurrentWindow() : null;
  } catch {
    return null;
  }
})();

/* ------------------------------------------------------------------ browser VFS */

const vfs = new Map(); // pseudo path -> { content, handle, lastModified }

/**
 * Storage that works even inside a sandboxed iframe, where touching
 * localStorage throws a SecurityError. Falls back to an in-memory map, so the
 * hosted demo never breaks; it just forgets things when you reload.
 */
const storage = (() => {
  try {
    const probe = '__notepads_probe__';
    globalThis.localStorage.setItem(probe, '1');
    globalThis.localStorage.removeItem(probe);
    return globalThis.localStorage;
  } catch {
    const mem = new Map();
    return {
      getItem: (k) => (mem.has(k) ? mem.get(k) : null),
      setItem: (k, v) => void mem.set(k, String(v)),
      removeItem: (k) => void mem.delete(k),
    };
  }
})();
let untitledSeq = 0;

function pseudoPath(name) {
  return `/home/demo/${name}`;
}

/* ------------------------------------------------------------------- API */
const api = {
  isTauri,
  label: ws?.label || 'browser',

  /* ---- files ---- */

  async readTextFile(path, { forceEncoding = null, allowBinary = false } = {}) {
    if (isTauri) {
      return T.core.invoke('read_text_file', {
        path,
        forceEncoding,
        allowBinary,
      });
    }
    const entry = vfs.get(path);
    if (!entry) throw new Error(`no such file: ${path}`);
    const text = entry.content;
    return {
      path,
      content: text,
      encoding: entry.encoding || 'UTF-8',
      encodingGuessed: false,
      lineEnding: text.includes('\r\n') ? 'CRLF' : 'LF',
      size: new Blob([text]).size,
      largeFile: false,
      readonly: false,
    };
  },

  async saveTextFile(
    path,
    contents,
    { encoding = 'UTF-8', lineEnding = 'LF', expectedModifiedMs = null, force = false } = {},
  ) {
    if (isTauri) {
      return T.core.invoke('save_text_file', {
        path,
        contents,
        encoding,
        lineEnding,
        expectedModifiedMs,
        force,
      });
    }
    const entry = vfs.get(path);
    if (entry?.handle) {
      const w = await entry.handle.createWritable();
      await w.write(new Blob([contents], { type: 'text/plain' }));
      await w.close();
    }
    vfs.set(path, { ...(entry || {}), content: contents, encoding, lastModified: Date.now() });
    const dl = entry?.handle ? null : downloadFile(path.split('/').pop(), contents);
    return {
      path,
      size: new Blob([contents]).size,
      modifiedMs: Date.now(),
      downloaded: !!dl,
    };
  },

  async fileMetadata(path) {
    if (isTauri) return T.core.invoke('file_metadata', { path });
    const e = vfs.get(path);
    return { exists: !!e, size: e ? new Blob([e.content]).size : 0, modifiedMs: e?.lastModified || 0, readonly: false };
  },

  async renameFile(from, to) {
    if (isTauri) return T.core.invoke('rename_file', { from, to });
    const e = vfs.get(from);
    if (e) {
      vfs.set(to, e);
      vfs.delete(from);
    }
  },

  async deleteFile(path) {
    if (isTauri) return T.core.invoke('delete_file', { path });
    vfs.delete(path);
  },

  async listEncodings() {

      { label: 'ASCII', name: 'ASCII', group: 'Western' },
      { label: 'WINDOWS-1252', name: 'ANSI (Windows-1252)', group: 'Western' },
      { label: 'ISO-8859-1', name: 'Western European (ISO-8859-1)', group: 'Western' },
      { label: 'ISO-8859-15', name: 'Western European (ISO-8859-15)', group: 'Western' },
      { label: 'WINDOWS-1251', name: 'Cyrillic (Windows-1251)', group: 'Cyrillic' },

  /* ---- windows ---- */

  async newWindow(files = []) {

  async isMaximized() {

  async takeLaunchFiles() {

  async on(event, handler) {

  async appInfo() {

  async readSettings() {

  async writeSettings(json) {

  async readSession() {

  async writeSession(json) {

/* ---------------------------------------------------------------- helpers */

function pickWithFileInput(multiple) {
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = multiple;
    input.accept = 'text/*,.txt,.md,.log,.json,.ini,.conf,.cfg,.yml,.yaml,.toml,.csv,.sh,.js,.ts,.py,.rs,.c,.h,.cpp,.xml,.html,.css';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', () => {
      const files = Array.from(input.files || []);
      input.remove();
      resolve(files);
    });
    input.addEventListener('cancel', () => {
      input.remove();
      resolve([]);
    });
    input.click();
  });
}

function loadBrowserFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const p = pseudoPath(file.name);
      vfs.set(p, { content: String(reader.result), lastModified: file.lastModified, encoding: 'UTF-8' });
      resolve(p);
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}

function downloadFile(name, contents) {
  const blob = new Blob([contents], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name || 'untitled.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return a;
}

function toastless(message) {
  // Avoid a hard dependency on the UI layer for this one informational case.
  console.info('[Notepads]', message);
}

/** Registers a dropped file into the virtual FS (browser drag & drop). */
async function registerDroppedFile(file) {
  if (isTauri) return file.path;
  return loadBrowserFile(file);
}

/* ============================== diff.js ============================== */
/**
 * diff.js — line based side-by-side diff for the Change Preview panel (Alt+D).
 *
 * A plain longest-common-subsequence table over lines, with a size guard so a
 * pathological pair of files cannot freeze the UI. This is the Linux stand-in
 * for the DiffPlex-powered viewer of the original application.
 */

const MAX_LINES = 6000;

/** @returns {Array<{type:'same'|'add'|'del'|'pad', left:string|null, right:string|null, leftNo:number|null, rightNo:number|null}>} */
function diffLines(oldText, newText) {
  const a = oldText.split('\n');
  const b = newText.split('\n');
  if (a.length > MAX_LINES || b.length > MAX_LINES) {
    return coarseDiff(a, b);
  }
  const n = a.length;
  const m = b.length;
  // LCS lengths, computed row by row to keep memory at O(m).
  const dp = new Uint32Array((n + 1) * (m + 1));
  const w = m + 1;
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i * w + j] =
        a[i] === b[j] ? dp[(i + 1) * w + j + 1] + 1 : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
    }
  }

  const rows = [];
  let i = 0;
  let j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) {
      rows.push(row('same', a[i], b[j], i + 1, j + 1));
      i++;
      j++;
    } else if (dp[(i + 1) * w + j] >= dp[i * w + j + 1]) {
      rows.push(row('del', a[i], null, i + 1, null));
      i++;
    } else {
      rows.push(row('add', null, b[j], null, j + 1));
      j++;
    }
  }
  while (i < n) {
    rows.push(row('del', a[i], null, i + 1, null));
    i++;
  }
  while (j < m) {
    rows.push(row('add', null, b[j], null, j + 1));
    j++;
  }
  return rows;
}

function row(type, left, right, leftNo, rightNo) {
  return { type, left, right, leftNo, rightNo };
}

function coarseDiff(a, b) {
  const rows = [];
  const max = Math.max(a.length, b.length);
  for (let i = 0; i < max; i++) {
    const l = a[i] ?? null;
    const r = b[i] ?? null;
    const type = l === r ? 'same' : l == null ? 'add' : 'del';
    rows.push(row(type, l, r, l == null ? null : i + 1, r == null ? null : i + 1));
  }
  return rows;
}
function diffStats(rows) {
  let added = 0;
  let removed = 0;
  for (const r of rows) {
    if (r.type === 'add') added++;
    else if (r.type === 'del') removed++;
  }
  return { added, removed, rows: rows.length };
}

/* ============================== app.js ============================== */
/**
 * app.js — Notepads for Linux, application shell.
 *
 * Contains the tab system, the command surface (menus, context menus, keyboard),
 * the find/replace card, the status bar, the settings pane, the dialogs, the
 * session snapshot and the window chrome. The text surface lives in editor.js and
 * every OS call goes through bridge.js.
 */




/* ------------------------------------------------------------------ helpers */

const $ = (sel, root = document) => root.querySelector(sel);

function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

const escapeHtml = (s) =>
  String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const basename = (p) => (p ? p.split(/[\\/]/).pop() : '');
const dirname = (p) => (p ? p.split(/[\\/]/).slice(0, -1).join('/') || '/' : '');
const toLF = (s) => s.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
const nowStamp = () => new Date().toLocaleString();

const EOL_LABEL = { CRLF: 'Windows (CRLF)', LF: 'Unix (LF)', CR: 'Macintosh (CR)' };

/* ----------------------------------------------------------------- settings */

const DEFAULT_SETTINGS = {
  theme: 'dark', // 'dark' | 'light' | 'system'  — Theme Mode
  accent: '#0078d4', // Accent Color
  useSystemAccent: false, // "Use my Windows/Linux accent color"
  tintOpacity: 90, // Background tint opacity
  transparentWindow: false,
  fontFamily: 'mono', // 'mono' | 'serif' | 'ui'
  fontSize: 13,
  lineHeight: 1.5,
  tabSize: 4,
  lineNumbers: true,
  highlightCurrentLine: true,
  highlightModifiedLines: true,
  wordWrap: false,
  defaultEncoding: 'auto', // 'auto' | a codec label
  defaultLineEnding: 'auto', // 'auto' | 'CRLF' | 'LF' | 'CR'
  restoreSessionOnStartup: true, // Session snapshot
  showStatusBar: true,
  autoGuessEncoding: true,
  recentFiles: [],
  windowTitleStyle: 'tab',
};

const S = {
  settings: { ...DEFAULT_SETTINGS },
  tabs: [],
  activeId: null,
  uid: 0,
  encodings: [],
  flyouts: [],

/* -------------------------------------------------------------------- theme */

function applyTheme() {
  const { theme } = S.settings;
  const dark =
    theme === 'system'
      ? (globalThis.matchMedia?.('(prefers-color-scheme: dark)')?.matches ?? true)
      : theme === 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
}

function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
  return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [0, 120, 212];
}

function applyAccent() {
  const rgb = hexToRgb(S.settings.accent);
  const root = document.documentElement.style;
  root.setProperty('--accent', S.settings.accent);
  root.setProperty('--accent-soft', `rgba(${rgb.join(',')},0.28)`);
  root.setProperty('--selection', `rgba(${rgb.join(',')},0.38)`);
  const lum = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255;
  root.setProperty('--accent-fg', lum > 0.62 ? '#101010' : '#ffffff');
}

function applySettingsToEditors() {
  S.editor.applySettings({
    fontFamily: S.settings.fontFamily,
    fontSize: S.settings.fontSize,
    lineHeight: S.settings.lineHeight,
    tabSize: S.settings.tabSize,
    wrap: S.settings.wordWrap,
    lineNumbers: S.settings.lineNumbers,
    highlightCurrentLine: S.settings.highlightCurrentLine,
  });
  $('#statusbar').classList.toggle('hidden', !S.settings.showStatusBar);
}

async function persistSettings() {
  try {
    await api.writeSettings(JSON.stringify(S.settings, null, 2));
  } catch (e) {
    console.warn('could not persist settings', e);
  }
}

function patchSettings(patch, { rerenderSettings = true } = {}) {
  S.settings = { ...S.settings, ...patch };
  applyTheme();
  applyAccent();
  applySettingsToEditors();
  persistSettings();
  updateStatusBar();
  if (rerenderSettings && S.settingsOpen) renderSettingsPane();
}

function pushRecent(path) {
  if (!path) return;
  const name = basename(path);
  const recent = [{ path, name }, ...S.settings.recentFiles.filter((r) => r.path !== path)].slice(0, 10);
  S.settings.recentFiles = recent;
  persistSettings();
}

/* --------------------------------------------------------------------- tabs */

function newDoc(opts = {}) {
  return {
    id: ++S.uid,
    path: opts.path ?? null,
    name: opts.name || (opts.path ? basename(opts.path) : 'Untitled.txt'),
    encoding: opts.encoding || 'UTF-8',
    lineEnding: opts.lineEnding || 'LF',
    encodingGuessed: !!opts.encodingGuessed,
    modified: false,
    readonly: !!opts.readonly,
    binary: !!opts.binary,
    size: opts.size || 0,
    diskModifiedMs: opts.diskModifiedMs || 0,
    diffBase: opts.diffBase ?? opts.text ?? '',
    // view state consumed by EditorView.load()/save()
    text: opts.text ?? '',
    undo: [],
    redo: [],
    scrollTop: 0,
    scrollLeft: 0,
    selStart: 0,
    selEnd: 0,
    search: null,
  };
}

function activeDoc() {
  return S.tabs.find((t) => t.id === S.activeId) || null;
}

function tabTitle(doc) {
  return doc.name + (doc.modified ? '*' : '');
}

function renderTabs() {
  const strip = $('#tabstrip');
  strip.textContent = '';
  for (const doc of S.tabs) {
    const fi = fileIconFor(doc.path, !doc.path);
    const iconEl = h('span', { class: 'tab-icon', style: `color:${doc.path ? fi.color : 'var(--fg-dim)'}` }, iconNode(fi.name, 14));
    const title = h('span', { class: 'tab-title', title: doc.path || doc.name, text: tabTitle(doc) });
    const dot = h('span', { class: 'dot' });
    const closeBtn = h(
      'button',
      {
        class: 'tab-close',
        title: 'Close tab (Ctrl+W)',
        'aria-label': `Close ${doc.name}`,
        onclick: (e) => {
          e.stopPropagation();
          closeTab(doc.id);
        },
      },
      dot,
      iconNode('close', 12),
    );
    const tab = h(
      'div',
      {
        class: `tab${doc.id === S.activeId ? ' active' : ''}${doc.modified ? ' modified' : ''}`,
        role: 'tab',
        tabindex: doc.id === S.activeId ? 0 : -1,
        'aria-selected': doc.id === S.activeId ? 'true' : 'false',
        title: doc.path ? `${doc.name}\n${doc.path}` : 'Untitled (not saved yet)',
        draggable: 'true',
        onclick: () => activateTab(doc.id),
        onauxclick: (e) => {
          if (e.button === 1) closeTab(doc.id);
        },
        oncontextmenu: (e) => {
          e.preventDefault();
          showTabContextMenu(e, doc);
        },
        ondragstart: (e) => {
          e.dataTransfer.setData('text/notepads-tab', String(doc.id));
          tab.classList.add('dragging');
        },
        ondragend: () => tab.classList.remove('dragging'),
      },
      iconEl,
      title,
      closeBtn,
    );
    tab.dataset.id = String(doc.id);
    strip.append(tab);
  }
}

function activateTab(id) {
  const doc = S.tabs.find((t) => t.id === id);
  if (!doc || id === S.activeId) return;
  const prev = activeDoc();
  if (prev) S.editor.save(prev);
  S.activeId = id;
  S.editor.load(doc);
  S.editor.setReadonly(doc.readonly || doc.binary);
  renderTabs();
  updateStatusBar();
  updateWindowTitle();
  if (doc.binary) showBinaryOverlay(doc);
  else hideBinaryOverlay();
  scheduleSessionSave();
  S.editor.focus();
}

function addTab(doc, { activate = true } = {}) {
  S.tabs.push(doc);
  if (activate) {
    const prev = activeDoc();
    if (prev && prev.id !== doc.id) {
      // The editor still holds the previous document: persist it before swapping.
      S.editor.save(prev);
    }
    S.activeId = doc.id;
    S.editor.load(doc);
    S.editor.setReadonly(doc.readonly || doc.binary);
  }
  renderTabs();
  updateStatusBar();
  updateWindowTitle();
  scheduleSessionSave();
  return doc;
}

function updateWindowTitle() {
  const doc = activeDoc();
  const name = doc ? doc.name : 'Notepads';

/* -------------------------------------------------------------- status bar */

function updateStatusBar() {
  const doc = activeDoc();
  if (!doc) return;
  $('#status-path').textContent = doc.path || doc.name;
  $('#status-path').title = doc.path || 'Unsaved document';
  $('#status-modified').classList.toggle('hidden', !doc.modified);
  const zoom = Math.round((S.settings.fontSize / 13) * 100);
  $('#status-zoom').textContent = `${zoom}%`;
  $('#status-eol').textContent = EOL_LABEL[doc.lineEnding] || doc.lineEnding;
  const enc = S.encodings.find((e) => e.label === doc.encoding);
  $('#status-encoding').textContent = enc ? enc.name : doc.encoding;
  $('#status-encoding').title = doc.encodingGuessed ? 'Encoding was guessed — click to change' : 'Encoding';
  const info = S.editor.cursorInfo();
  const sel = info.selected ? ` (${info.selected} selected)` : '';
  $('#status-pos').textContent = `Ln ${info.line}, Col ${info.col}${sel}`;
}

/** The maximize button doubles as a restore button, like the Windows original. */
async function refreshMaximizeIcon() {
  const maximized = await api.isMaximized();
  const btn = $('#win-max');
  if (!btn) return;
  btn.textContent = '';
  btn.append(iconNode(maximized ? 'windowRestore' : 'windowMax', 12));

/* --------------------------------------------------------------- find card */

function openFind({ replace = false } = {}) {
  const card = $('#find-card');
  card.classList.remove('hidden');
  $('#replace-row').classList.toggle('hidden', !replace);
  const input = $('#find-input');
  const doc = activeDoc();
  if (doc?.search?.query && !input.value) input.value = doc.search.query;
  if (input.value === '' && doc) {
    const { start, end } = S.editor.selectionRange;
    if (end > start && end - start < 200 && !doc.text.slice(start, end).includes('\n')) {
      input.value = doc.text.slice(start, end);
    }
  }
  input.focus();
  input.select();
  runSearch();
}

function closeFind() {
  $('#find-card').classList.add('hidden');
  S.editor.setSearch({ active: false, query: '' }, { silent: true });
  S.editor.focus();
}

function runSearch() {
  const query = $('#find-input').value;
  const opts = {
    active: query.length > 0,
    query,
    matchCase: $('#find-options [data-opt="matchCase"]').classList.contains('on'),
    wholeWord: $('#find-options [data-opt="wholeWord"]').classList.contains('on'),
    regex: $('#find-options [data-opt="regex"]').classList.contains('on'),
  };
  const res = S.editor.setSearch(opts);
  const status = $('#find-status');
  const idx = S.editor.activeMatchIndex;
  if (res.error) {
    status.textContent = 'Invalid regex';
    status.classList.add('error');
    status.title = res.error;
  } else {
    status.classList.remove('error');
    status.title = '';
    status.textContent = res.count ? `${idx + 1}/${res.count}` : query ? 'No results' : '';
  }
  updateStatusBar();
}

/** Replaces the hit the find card is currently parked on, then re-runs the search. */
function doReplace() {
  if ($('#replace-row').classList.contains('hidden')) return;
  const replacement = $('#replace-input').value;
  const ok = S.editor.replaceCurrent(replacement);
  if (!ok) {
    toast({ title: 'Nothing to replace', text: 'Search for something first.' });
    return;
  }
  runSearch();
  updateStatusBar();
}

/* -------------------------------------------------------------------- menus */

function closeFlyouts() {
  for (const f of S.flyouts.splice(0)) f.remove();
  $('#menu-btn').classList.remove('open');
}

function positionFlyout(el, anchor, { align = 'start', below = true } = {}) {
  el.style.visibility = 'hidden';
  el.style.left = '0px';
  el.style.top = '0px';
  // `anchor` is either an element or a raw viewport point (context menus).
  const r =
    typeof anchor === 'object' && 'getBoundingClientRect' in anchor
      ? anchor.getBoundingClientRect()
      : { left: anchor, right: anchor, top: anchor, bottom: anchor };
  const box = el.getBoundingClientRect();
  let left = align === 'end' ? r.right - box.width : r.left;
  let top = below ? r.bottom + 4 : r.top - box.height - 4;
  left = Math.max(6, Math.min(left, innerWidth - box.width - 6));
  top = Math.max(6, Math.min(top, innerHeight - box.height - 6));
  el.style.left = `${Math.round(left)}px`;
  el.style.top = `${Math.round(top)}px`;
  el.style.visibility = '';
}

/**
 * items: { label, keys, icon, action, sep, disabled, checked, submenu }
 */
function openFlyout(items, anchorEl, opts = {}) {
  closeFlyouts();
  const el = h('div', { class: 'flyout', role: 'menu' });
  for (const item of items) {
    if (item.sep) {
      el.append(h('div', { class: 'menu-sep' }));
      continue;
    }
    if (item.header) {
      el.append(h('div', { class: 'menu-sep' }));
      el.append(h('div', { class: 'menu-item disabled', style: 'font-size:11px;padding:4px 10px' }, item.header));
      continue;
    }
    const main = h(
      'button',
      {
        class: `menu-item${item.disabled ? ' disabled' : ''}`,
        role: 'menuitem',
        onclick: async (e) => {
          if (item.disabled) return;
          if (item.submenu) {
            openFlyout(item.submenu(), e.currentTarget, { align: 'end' });
            return;
          }
          closeFlyouts();
          await item.action?.();
        },
      },
      h('span', { style: 'width:16px;display:flex' }, item.checked != null ? iconNode(item.checked ? 'check' : 'dash', 14) : item.icon ? iconNode(item.icon, 16) : null),
      h('span', { class: 'label', text: item.label }),
      item.keys ? h('span', { class: 'keys', text: item.keys }) : null,
      item.submenu ? iconNode('chevronRight', 12) : null,
    );
    el.append(main);
  }
  document.body.append(el);
  positionFlyout(el, anchorEl, opts);
  S.flyouts.push(el);
  return el;
}

function wordAt(pos) {
  const text = activeDoc()?.text || '';
  const isWord = (c) => !!c && /[\w\u00C0-\u024F'’-]/.test(c);
  let s = pos;
  let e = pos;
  while (s > 0 && isWord(text[s - 1])) s--;
  while (e < text.length && isWord(text[e])) e++;
  return text.slice(s, e).trim();
}

function toggleRtl() {
  const b = S.editor.el.buffer;
  const rtl = b.dir === 'rtl';
  b.dir = rtl ? 'ltr' : 'rtl';
  S.editor.el.backdropInner.dir = rtl ? 'ltr' : 'rtl';
  toast({ title: rtl ? 'Left-to-right' : 'Right-to-left', text: 'Text flow direction changed' });
}

const SETTINGS_SECTIONS = [
  { id: 'personalization', icon: 'lab', label: 'Personalization' },
  { id: 'textEditor', icon: 'textFont', label: 'Text editor' },
  { id: 'advanced', icon: 'code', label: 'Advanced' },

function toggleSettings(open) {
  S.settingsOpen = open ?? !S.settingsOpen;
  $('#settings').classList.toggle('hidden', !S.settingsOpen);
  if (S.settingsOpen) {
    renderSettingsPane();
    closeFlyouts();
  } else {
    S.editor.focus();
  }
}

function field(label, control, hint) {
  return h(
    'div',
    { class: 'field' },
    h('label', { text: label }),
    control,
    hint ? h('span', { class: 'hint', style: 'margin:0', text: hint }) : null,
  );
}

function radio(label, name, value, checked, onChange) {
  const input = h('input', { type: 'radio', name, checked, onchange: (e) => e.target.checked && onChange(value) });
  return h('label', { class: 'radio-row' }, input, h('span', { text: label }));
}

function toggleSwitch(checked, onChange) {
  const input = h('input', { type: 'checkbox', checked, onchange: (e) => onChange(e.target.checked) });
  return h('span', { class: 'switch' }, input, h('span', { class: 'track' }), h('span', { class: 'knob' }));
}

function renderSettingsPane() {
  const pane = $('#settings');
  pane.textContent = '';
  const rail = h('nav', { class: 'settings-rail', 'aria-label': 'Settings sections' });
  for (const s of SETTINGS_SECTIONS) {
    rail.append(
      h(
        'button',
        {
          class: `rail-btn${S.settingsSection === s.id ? ' active' : ''}`,
          title: s.label,
          'aria-label': s.label,
          onclick: () => {
            S.settingsSection = s.id;
            renderSettingsPane();
          },
        },
        iconNode(s.icon, 18),
      ),
    );
  }
  const body = h('div', { class: 'settings-body' });
  const sec = S.settingsSection;
  body.append(
    sec === 'personalization'
      ? personalizationSection()
      : sec === 'textEditor'
        ? textEditorSection()
        : sec === 'advanced'
          ? advancedSection()
          : aboutSection(),
  );
  pane.append(body, rail);
}

/* ----------------------------------------------------------------- dialogs */

function dialog({ title, message, details, list, buttons, width }) {
  return new Promise((resolve) => {
    const scrim = h('div', { class: 'scrim' });
    const box = h('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true' });
    if (width) box.style.width = `${width}px`;
    box.append(h('div', { class: 'dialog-head', text: title }));
    const body = h('div', { class: 'dialog-body' });
    if (message) body.append(h('div', { text: message }));
    if (details) body.append(h('div', { class: 'detail', text: details }));
    if (list?.length) {
      const ul = h('ul', { class: 'dialog-list' });
      for (const item of list) ul.append(h('li', { text: item }));
      body.append(ul);
    }
    box.append(body);
    const foot = h('div', { class: 'dialog-foot' });
    const done = (value) => {
      scrim.remove();
      document.removeEventListener('keydown', onKey, true);
      resolve(value);
    };
    for (const b of buttons) {
      foot.append(
        h('button', {
          class: `btn${b.primary ? ' primary' : ''}`,
          text: b.label,
          onclick: () => done(b.value),
        }),
      );
    }
    box.append(foot);
    scrim.append(box);
    document.body.append(scrim);
    const focusTarget = foot.querySelector('.btn.primary') || foot.querySelector('.btn');
    focusTarget?.focus();

    function onKey(e) {
      if (e.key === 'Escape') {
        e.stopPropagation();
        done(buttons.find((b) => b.cancel)?.value ?? 'cancel');
      } else if (e.key === 'Enter' && !e.shiftKey) {
        const primary = foot.querySelector('.btn.primary');
        if (primary) {
          e.preventDefault();
          e.stopPropagation();
          done(buttons.find((b) => b.primary)?.value ?? 'ok');
        }
      }
    }
    document.addEventListener('keydown', onKey, true);
  });
}

function promptDialog({ title, message, label, value = '', okLabel = 'OK' }) {
  return new Promise((resolve) => {
    const scrim = h('div', { class: 'scrim' });
    const input = h('input', { type: 'text', value, style: 'width:100%;margin-top:12px' });
    const box = h('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true' });
    box.append(
      h('div', { class: 'dialog-head', text: title }),
      h('div', { class: 'dialog-body' }, h('div', { text: message }), label ? h('div', { class: 'detail', text: label }) : null, input),
    );
    const done = (v) => {
      scrim.remove();
      resolve(v);
    };
    box.append(
      h(
        'div',
        { class: 'dialog-foot' },
        h('button', { class: 'btn', text: 'Cancel', onclick: () => done(null) }),
        h('button', { class: 'btn primary', text: okLabel, onclick: () => done(input.value) }),
      ),
    );
    scrim.append(box);
    document.body.append(scrim);
    input.focus();
    input.select();
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') done(input.value);
      if (e.key === 'Escape') done(null);
    });
  });
}

function toast({ title, text, kind = 'info', timeout = 3400 }) {
  const host = $('#toast-host');
  const node = h(
    'div',
    { class: `toast${kind === 'warn' ? ' warn' : ''}` },
    h('div', { class: 'toast-title', text: title }),
    text ? h('div', { class: 'toast-text', text }) : null,
  );
  host.append(node);
  setTimeout(() => {
    node.classList.add('out');
    setTimeout(() => node.remove(), 200);
  }, timeout);
  return node;
}
