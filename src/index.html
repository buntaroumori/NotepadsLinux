<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Untitled - Notepads</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- ---------------------------------------------------------- title bar -->
      <header class="titlebar" id="titlebar" data-tauri-drag-region>
        <button class="menu-btn" id="menu-btn" aria-label="Main menu" aria-haspopup="menu" title="Menu (Alt)"></button>
        <div class="tabstrip" id="tabstrip" role="tablist" aria-label="Open documents"></div>
        <button class="new-tab-btn" id="new-tab-btn" title="New tab (Ctrl+N)" aria-label="New tab"></button>
        <div class="titlebar-spacer" data-tauri-drag-region></div>
        <div class="window-controls" id="window-controls">
          <button class="win-btn" id="win-min" title="Minimize" aria-label="Minimize"></button>
          <button class="win-btn" id="win-max" title="Maximize" aria-label="Maximize"></button>
          <button class="win-btn close" id="win-close" title="Close window (Ctrl+Shift+W)" aria-label="Close"></button>
        </div>
      </header>

      <!-- ---------------------------------------------------------- workspace -->
      <main class="workspace" id="workspace">
        <div class="editor" id="editor"></div>

        <!-- ------------------------------------------------------- find card -->
        <div class="find-card hidden" id="find-card" role="dialog" aria-label="Find and replace">
          <div class="find-row">
            <input class="find-input" id="find-input" placeholder="Find" spellcheck="false" aria-label="Find" />
            <span class="find-status" id="find-status"></span>
            <button class="icon-btn" id="find-options-toggle" title="Search options" aria-label="Search options"></button>
            <button class="icon-btn" id="find-prev" title="Find previous (Shift+F3)" aria-label="Find previous"></button>
            <button class="icon-btn" id="find-next" title="Find next (F3)" aria-label="Find next"></button>
            <button class="icon-btn" id="find-close" title="Dismiss" aria-label="Dismiss"></button>
          </div>
          <div class="find-row hidden" id="replace-row">
            <button class="icon-btn" id="replace-toggle" title="Toggle replace mode" aria-label="Toggle replace mode"></button>
            <input class="find-input" id="replace-input" placeholder="Replace" spellcheck="false" aria-label="Replace" />
            <button class="icon-btn" id="replace-one" title="Replace" aria-label="Replace"></button>
            <button class="icon-btn" id="replace-all" title="Replace all" aria-label="Replace all"></button>
          </div>
          <div class="find-options hidden" id="find-options">
            <button class="check-chip" data-opt="matchCase"><span class="box"></span>Match case</button>
            <button class="check-chip" data-opt="wholeWord"><span class="box"></span>Match whole word</button>
            <button class="check-chip" data-opt="regex"><span class="box"></span>Use regex</button>
          </div>
        </div>

        <!-- ---------------------------------------------------------- settings -->
        <section class="settings hidden" id="settings" aria-label="Settings"></section>
      </main>

      <!-- --------------------------------------------------------- status bar -->
      <footer class="statusbar" id="statusbar">
        <div class="status-path" id="status-path"></div>
        <div class="status-right">
          <span class="status-item status-modified hidden" id="status-modified">Modified</span>
          <span class="status-item" id="status-pos">Ln 1, Col 1</span>
          <button class="status-item btn" id="status-zoom" title="Font zoom">100%</button>
          <button class="status-item btn" id="status-eol" title="Line endings">Unix (LF)</button>
          <button class="status-item btn" id="status-encoding" title="Encoding">UTF-8</button>
        </div>
      </footer>
    </div>

    <div class="toast-host" id="toast-host"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
